spring:
  config:
    import: optional:file:../.env[.properties]
  application:
    name: tapetes-kalke-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tapetes_kalke}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    # O Supabase grátis aceita poucas conexões simultâneas.
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo
        format_sql: true
  flyway:
    enabled: true
  jackson:
    time-zone: America/Sao_Paulo
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
server:
  port: ${PORT:8080}
  error:
    include-message: never
app:
  cors:
    allowed-origin: ${FRONTEND_URL:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:admin@tapeteskalke.local}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:CHANGE_ME_AT_FIRST_START}
# Documentação da API desligada por padrão; ligue com API_DOCS_ENABLED=true apenas em desenvolvimento.
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
management:
  # Sem servidor de e-mail configurado, a checagem de e-mail deixaria o /actuator/health como DOWN (e o Render recusaria o deploy).
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
