name: Publicar telas no GitHub Pages
on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Gerar site
        env:
          # Endereço da API no Render, definido em Settings > Secrets and variables > Actions > Variables.
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          if [ -z "$VITE_API_URL" ]; then echo "::error::Crie a variável API_URL (ex.: https://tapetes-kalke-api.onrender.com/api/v1)"; exit 1; fi
          npm run build
          # O GitHub Pages devolve 404.html para rotas desconhecidas; com a cópia do index, recarregar /vendas continua funcionando.
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - id: deployment
        uses: actions/deploy-pages@v4
